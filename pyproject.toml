[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aoa-ai-optimization-automation"
version = "0.1.0"
description = "AI Optimization Automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aoa = "aoa.main:main"

[tool.setuptools.packages.find]
where = ["src"]
